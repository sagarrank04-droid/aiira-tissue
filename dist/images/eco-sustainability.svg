<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <filter id="ecoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#002d3d" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="500" height="400" fill="#f4faf8" rx="20"/>
  <circle cx="250" cy="200" r="150" fill="#e2f5ee" />

  <!-- Eco Leaf & Water Drop Shield -->
  <g transform="translate(150, 80)" filter="url(#ecoShadow)">
    <path d="M100,0 C170,0 200,40 200,120 C200,190 100,240 100,240 C100,240 0,190 0,120 C0,40 30,0 100,0 Z" fill="#00587a"/>
    <path d="M100,15 C155,15 180,50 180,118 C180,175 100,220 100,220 C100,220 20,175 20,118 C20,50 45,15 100,15 Z" fill="#ffffff"/>

    <!-- Green Plant Sprout & Water Droplet -->
    <path d="M100,70 C100,70 125,95 125,120 C125,134 114,145 100,145 C86,145 75,134 75,120 C75,95 100,70 100,70 Z" fill="#75b8c8"/>
    <path d="M100,145 C100,145 135,140 145,110 C145,140 120,165 100,165 Z" fill="#58a587"/>
    
    <text x="100" y="195" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" fill="#00587a" text-anchor="middle">100% ECO FRIENDLY</text>
    <text x="100" y="208" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="8" fill="#58a587" text-anchor="middle">FSC &amp; DERMA CERTIFIED</text>
  </g>
</svg>
