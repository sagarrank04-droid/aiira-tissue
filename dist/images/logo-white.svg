<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 95" width="320" height="95" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,800;1,600&amp;display=swap');
      .logo-title {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 800;
        font-size: 52px;
      }
      .logo-subtitle {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 600;
        font-style: italic;
        font-size: 15px;
        letter-spacing: 0.2px;
      }
    </style>
  </defs>

  <!-- ICON (Tissue Box with Pulling Tissue) -->
  <g transform="translate(6, 4)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Emerging Folded Tissue -->
    <path d="M 40,42 C 37,28 32,12 50,7 C 64,2 72,18 84,10 C 94,4 96,21 82,37 C 76,44 65,46 58,45" 
          fill="#ffffff" stroke="#ffffff" stroke-width="3.2" />
    <path d="M 52,16 C 60,20 70,16 78,24" fill="none" stroke="#75b8c8" stroke-width="2.2" />
    
    <!-- Top Face of Box -->
    <polygon points="12,47 58,33 108,47 62,61" fill="rgba(255,255,255,0.18)" stroke="#ffffff" stroke-width="3.2" />
    
    <!-- Center Slit Oval -->
    <ellipse cx="60" cy="47" rx="26" ry="4.5" fill="#75b8c8" stroke="#ffffff" stroke-width="2" />
    
    <!-- Front Face Left -->
    <polygon points="12,47 62,61 62,80 12,66" fill="rgba(255,255,255,0.08)" stroke="#ffffff" stroke-width="3.2" />
    
    <!-- Front Face Right -->
    <polygon points="62,61 108,47 108,66 62,80" fill="rgba(255,255,255,0.14)" stroke="#ffffff" stroke-width="3.2" />
    
    <!-- Modern Dimension Accent Lines -->
    <line x1="18" y1="53" x2="56" y2="63" stroke="#ffffff" stroke-width="1.8" opacity="0.4" />
    <line x1="18" y1="60" x2="56" y2="70" stroke="#ffffff" stroke-width="1.8" opacity="0.4" />
    <line x1="68" y1="63" x2="102" y2="53" stroke="#ffffff" stroke-width="1.8" opacity="0.4" />
    <line x1="68" y1="70" x2="102" y2="60" stroke="#ffffff" stroke-width="1.8" opacity="0.4" />
  </g>

  <!-- WORDMARK: Aiira -->
  <!-- A -->
  <text x="122" y="55" class="logo-title" fill="#ffffff">A</text>
  <!-- first i -->
  <text x="160" y="55" class="logo-title" fill="#ffffff">i</text>
  <!-- second i (Brand Soft Aqua Cyan Accent) -->
  <text x="176" y="55" class="logo-title" fill="#75b8c8">i</text>
  <!-- r -->
  <text x="193" y="55" class="logo-title" fill="#ffffff">r</text>
  <!-- a -->
  <text x="216" y="55" class="logo-title" fill="#ffffff">a</text>

  <!-- TAGLINE: The Soft Side of Everyday -->
  <text x="123" y="74" class="logo-subtitle" fill="#bce2eb">The Soft Side of Everyday</text>
</svg>
