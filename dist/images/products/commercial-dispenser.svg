<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <filter id="dispShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#002d3d" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="500" height="400" fill="#f4fbfd" rx="20"/>
  <circle cx="250" cy="200" r="140" fill="#e2f4f8" />
  <ellipse cx="250" cy="335" rx="150" ry="20" fill="#00374a" opacity="0.15" />

  <!-- Wall Mounted Dispenser / Jumbo Roll -->
  <g transform="translate(145, 80)" filter="url(#dispShadow)">
    <rect width="210" height="230" rx="25" fill="#ffffff" stroke="#c0e2ea" stroke-width="2"/>
    <rect x="15" y="20" width="180" height="150" rx="18" fill="#eef7fa"/>
    <circle cx="105" cy="95" r="55" fill="#00587a"/>
    <circle cx="105" cy="95" r="22" fill="#75b8c8"/>
    <ellipse cx="105" cy="210" rx="40" ry="8" fill="#c0e0e8"/>
    <!-- Tissue hanging from bottom slot -->
    <path d="M75,210 L85,250 C95,255 115,255 125,250 L135,210 Z" fill="#ffffff" stroke="#c0e2ea" stroke-width="1.5"/>
    
    <text x="105" y="195" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13" fill="#00587a" text-anchor="middle">Aiira Pro Commercial</text>
  </g>
</svg>
