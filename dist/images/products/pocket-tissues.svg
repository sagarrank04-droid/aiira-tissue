<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <filter id="pockShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#002d3d" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="500" height="400" fill="#f4fbfd" rx="20"/>
  <circle cx="250" cy="200" r="140" fill="#e2f4f8" />
  <ellipse cx="250" cy="335" rx="150" ry="20" fill="#00374a" opacity="0.15" />

  <!-- Pocket Tissue Pack 1 (Blue) -->
  <g transform="translate(110, 110) rotate(-10)" filter="url(#pockShadow)">
    <rect width="140" height="200" rx="18" fill="#ffffff" stroke="#c0e2ea" stroke-width="2"/>
    <rect x="8" y="8" width="124" height="184" rx="12" fill="#00587a"/>
    <ellipse cx="70" cy="90" rx="40" ry="16" fill="#75b8c8" opacity="0.4"/>
    <text x="70" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="20" fill="#ffffff" text-anchor="middle">Aiira</text>
    <text x="70" y="86" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="8" fill="#75b8c8" text-anchor="middle">POCKET PACK</text>
    <text x="70" y="150" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="9" fill="#ffffff" text-anchor="middle">10 Sheets • 4-Ply</text>
  </g>

  <!-- Pocket Tissue Pack 2 (Aqua Mint) -->
  <g transform="translate(230, 95) rotate(12)" filter="url(#pockShadow)">
    <rect width="140" height="200" rx="18" fill="#ffffff" stroke="#c0e2ea" stroke-width="2"/>
    <rect x="8" y="8" width="124" height="184" rx="12" fill="#75b8c8"/>
    <text x="70" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="20" fill="#ffffff" text-anchor="middle">Aiira</text>
    <text x="70" y="86" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="8" fill="#003649" text-anchor="middle">FRESH CITRUS</text>
    <path d="M40,110 C55,95 85,95 100,110" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="70" y="150" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="9" fill="#003649" text-anchor="middle">10 Sheets • 4-Ply</text>
  </g>
</svg>
