<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <filter id="napkShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#002d3d" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="500" height="400" fill="#f4fbfd" rx="20"/>
  <circle cx="250" cy="200" r="140" fill="#e2f4f8" />
  <ellipse cx="250" cy="330" rx="150" ry="20" fill="#00374a" opacity="0.15" />

  <!-- Stacked Napkins Package -->
  <g transform="translate(130, 100)" filter="url(#napkShadow)">
    <rect width="240" height="200" rx="16" fill="#ffffff" stroke="#c0e2ea" stroke-width="2"/>
    
    <!-- Clear Window Wrap Graphic -->
    <rect x="15" y="15" width="210" height="170" rx="10" fill="#fcfdfe"/>
    <!-- Folded embossed tissue sheets pattern -->
    <g stroke="#d5edf2" stroke-width="1.5">
      <line x1="25" y1="35" x2="215" y2="35"/>
      <line x1="25" y1="50" x2="215" y2="50"/>
      <line x1="25" y1="65" x2="215" y2="65"/>
      <line x1="25" y1="80" x2="215" y2="80"/>
      <line x1="25" y1="95" x2="215" y2="95"/>
    </g>

    <!-- Band across center -->
    <rect x="0" y="105" width="240" height="70" fill="#00587a"/>
    <text x="120" y="135" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="22" fill="#ffffff" text-anchor="middle">Aiira</text>
    <text x="120" y="152" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="9" fill="#75b8c8" text-anchor="middle">DINNER TABLE NAPKINS</text>
    <text x="120" y="165" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="8" fill="#e0f4f8" text-anchor="middle">100 Pcs • 2-Ply Embossed Border</text>
  </g>
</svg>
