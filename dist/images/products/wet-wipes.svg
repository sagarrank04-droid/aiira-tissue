<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <filter id="wipeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#002d3d" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="500" height="400" fill="#f4fbfd" rx="20"/>
  <circle cx="250" cy="200" r="140" fill="#e2f4f8" />
  <ellipse cx="250" cy="325" rx="160" ry="20" fill="#00374a" opacity="0.15" />

  <!-- Wet Wipes Flip Top Pouch -->
  <g transform="translate(100, 130)" filter="url(#wipeShadow)">
    <rect width="300" height="170" rx="35" fill="#00587a"/>
    <rect x="10" y="10" width="280" height="150" rx="26" fill="#004c6a"/>
    
    <!-- Flip Top Cap -->
    <rect x="95" y="45" width="110" height="70" rx="18" fill="#75b8c8" stroke="#ffffff" stroke-width="2"/>
    <ellipse cx="150" cy="80" rx="35" ry="16" fill="#ffffff" opacity="0.9"/>
    <text x="150" y="85" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#00587a" text-anchor="middle">PUSH</text>
    
    <!-- Branding -->
    <text x="50" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="20" fill="#ffffff">Aiira</text>
    <text x="50" y="78" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="8" fill="#75b8c8">PURE WIPES</text>

    <text x="245" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" fill="#ffffff" text-anchor="middle">80 PCS</text>
    <text x="245" y="78" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="7.5" fill="#75b8c8" text-anchor="middle">99% PURE WATER</text>

    <!-- Bottom Features -->
    <rect x="25" y="125" width="250" height="24" rx="12" fill="#00374c"/>
    <text x="150" y="141" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="9" fill="#e0f4f8" text-anchor="middle">0% Alcohol • Fragrance Free • PH Balanced</text>
  </g>
</svg>
