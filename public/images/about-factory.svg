<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="factGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00587a"/>
      <stop offset="100%" stop-color="#00374c"/>
    </linearGradient>
    <filter id="fShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#002d3d" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="600" height="450" fill="#f2fafc" rx="20"/>

  <!-- Sun / Sky Accent -->
  <circle cx="450" cy="120" r="60" fill="#e0f4f8" opacity="0.8"/>

  <!-- Factory Silhouettes & Green Landscape -->
  <path d="M0,380 Q300,340 600,380 L600,450 L0,450 Z" fill="#75b8c8" opacity="0.25"/>
  <path d="M0,390 Q200,365 600,400 L600,450 L0,450 Z" fill="#00587a" opacity="0.12"/>

  <!-- High-Tech Modern Production Plant -->
  <g transform="translate(70, 140)" filter="url(#fShadow)">
    <!-- Main Plant Building -->
    <rect x="50" y="80" width="360" height="170" rx="12" fill="url(#factGrad)"/>
    
    <!-- Architectural Glass Windows / Modern Facade -->
    <rect x="70" y="110" width="140" height="110" rx="6" fill="#75b8c8" opacity="0.3" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="140" y1="110" x2="140" y2="220" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="70" y1="165" x2="210" y2="165" stroke="#ffffff" stroke-width="1.5"/>

    <rect x="230" y="130" width="160" height="90" rx="6" fill="#003144" stroke="#75b8c8" stroke-width="1"/>

    <!-- Roof Solar Panels Array -->
    <polygon points="50,80 120,40 430,40 360,80" fill="#00435c" stroke="#75b8c8" stroke-width="1"/>
    <line x1="120" y1="40" x2="140" y2="80" stroke="#75b8c8" stroke-width="1.5"/>
    <line x1="220" y1="40" x2="230" y2="80" stroke="#75b8c8" stroke-width="1.5"/>
    <line x1="320" y1="40" x2="310" y2="80" stroke="#75b8c8" stroke-width="1.5"/>

    <!-- Clean Tech Hygiene Emblem -->
    <circle cx="310" cy="175" r="28" fill="#75b8c8" opacity="0.2"/>
    <circle cx="310" cy="175" r="22" fill="#00587a"/>
    <path d="M302,175 L308,181 L320,169" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Plant Title -->
    <text x="70" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" fill="#00587a">Aiira CleanTech Hygiene Plant</text>
    <text x="70" y="96" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="10" fill="#75b8c8">100% Automated Touchless Processing</text>
  </g>

  <!-- Green Trees & Environment Icons -->
  <g transform="translate(440, 260)">
    <path d="M30,70 L40,110 L20,110 Z" fill="#00587a"/>
    <circle cx="30" cy="60" r="26" fill="#58a587"/>
    <circle cx="30" cy="40" r="20" fill="#70c4a1"/>
  </g>
  <g transform="translate(50, 280)">
    <path d="M30,60 L40,90 L20,90 Z" fill="#00587a"/>
    <circle cx="30" cy="50" r="22" fill="#58a587"/>
    <circle cx="30" cy="35" r="16" fill="#70c4a1"/>
  </g>
</svg>
