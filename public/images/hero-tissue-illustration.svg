<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%">
  <defs>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00587a"/>
      <stop offset="100%" stop-color="#003d54"/>
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#75b8c8"/>
      <stop offset="100%" stop-color="#4997ab"/>
    </linearGradient>
    <linearGradient id="boxGradPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e6ea"/>
      <stop offset="100%" stop-color="#ebd1d8"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f0f7f9"/>
      <stop offset="100%" stop-color="#d9ebf0"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2bc68"/>
      <stop offset="100%" stop-color="#b88f34"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#002d3d" flood-opacity="0.22"/>
    </filter>
    <filter id="paperShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#004866" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background Glow & Decorative Elements -->
  <circle cx="400" cy="360" r="280" fill="#e8f5f8" opacity="0.65" />
  <circle cx="580" cy="220" r="140" fill="#d0edf3" opacity="0.45" />
  <circle cx="220" cy="480" r="90" fill="#fcf3ec" opacity="0.6" />

  <!-- Floating Feather / Softness Accents -->
  <g opacity="0.8" transform="translate(140, 160) rotate(-25) scale(0.9)">
    <path d="M0,0 C30,-40 80,-30 110,-5 C130,10 115,35 90,40 C60,45 25,30 0,0 Z" fill="#ffffff" filter="url(#paperShadow)"/>
    <path d="M5,2 C40,-15 80,5 105,15" stroke="#75b8c8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <g opacity="0.75" transform="translate(620, 130) rotate(35) scale(0.75)">
    <path d="M0,0 C30,-40 80,-30 110,-5 C130,10 115,35 90,40 C60,45 25,30 0,0 Z" fill="#ffffff" filter="url(#paperShadow)"/>
    <path d="M5,2 C40,-15 80,5 105,15" stroke="#75b8c8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Ground Soft Reflection / Shadow -->
  <ellipse cx="400" cy="540" rx="310" ry="38" fill="#00374a" opacity="0.12" />
  <ellipse cx="380" cy="535" rx="220" ry="24" fill="#00374a" opacity="0.18" />

  <!-- SECONDARY PRODUCT: ROLLS (Behind) -->
  <g transform="translate(480, 220)" filter="url(#softShadow)">
    <!-- Roll 1 -->
    <ellipse cx="110" cy="110" rx="65" ry="32" fill="#eef7fa" stroke="#c0dfe6" stroke-width="2"/>
    <rect x="45" y="110" width="130" height="150" fill="#ffffff" />
    <ellipse cx="110" cy="260" rx="65" ry="32" fill="#e2f0f4" />
    <ellipse cx="110" cy="110" rx="24" ry="12" fill="#75b8c8" opacity="0.4"/>
    <ellipse cx="110" cy="110" rx="14" ry="7" fill="#00587a"/>
    <!-- Roll Embossed Quilt Pattern -->
    <line x1="50" y1="160" x2="170" y2="160" stroke="#d5edf2" stroke-width="2" stroke-dasharray="4 4"/>
    <line x1="50" y1="210" x2="170" y2="210" stroke="#d5edf2" stroke-width="2" stroke-dasharray="4 4"/>
    <rect x="45" y="155" width="130" height="40" fill="#00587a" opacity="0.9"/>
    <text x="110" y="180" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" fill="#ffffff" text-anchor="middle">Aiira Roll</text>
    <text x="110" y="190" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#75b8c8" text-anchor="middle">3-PLY ULTRA SOFT</text>
  </g>

  <!-- MAIN PRODUCT: LUXURY TISSUE BOX (Isometric 3D) -->
  <g transform="translate(180, 260)" filter="url(#softShadow)">
    <!-- Emerging Luxury Soft Tissue Sheets -->
    <g filter="url(#paperShadow)">
      <!-- Wave 1 (Back) -->
      <path d="M120,50 C100,-40 170,-90 230,-100 C280,-110 300,-50 270,-10 C250,15 210,35 180,48 Z" fill="url(#paperGrad)" />
      <!-- Wave 2 (Front High Elegance) -->
      <path d="M150,52 C120,-20 150,-130 220,-140 C280,-150 320,-80 285,-30 C260,10 215,40 170,55 Z" fill="#ffffff" stroke="#e0f0f5" stroke-width="1.5"/>
      <!-- Soft Creases / Folds -->
      <path d="M170,-110 C210,-80 240,-40 230,10" fill="none" stroke="#75b8c8" stroke-width="2" opacity="0.6"/>
      <path d="M220,-138 C250,-100 270,-60 260,-15" fill="none" stroke="#00587a" stroke-width="1.5" opacity="0.3"/>
    </g>

    <!-- Top Face of Box -->
    <path d="M 40,60 L 220,10 L 410,65 L 230,115 Z" fill="url(#boxGrad2)" />
    
    <!-- Gold / Silver Border Foil on Top -->
    <path d="M 52,60 L 220,16 L 398,65 L 230,109 Z" fill="none" stroke="url(#goldAccent)" stroke-width="2.5" opacity="0.75" />

    <!-- Oval Dispenser Slot -->
    <ellipse cx="228" cy="62" rx="90" ry="22" fill="#003b4f" />
    <ellipse cx="228" cy="62" rx="84" ry="18" fill="#002b3a" stroke="#75b8c8" stroke-width="2"/>

    <!-- Left Front Face -->
    <path d="M 40,60 L 230,115 L 230,225 L 40,170 Z" fill="url(#boxGrad1)" />
    <!-- Front Right Face -->
    <path d="M 230,115 L 410,65 L 410,175 L 230,225 Z" fill="#00435c" />

    <!-- Brand Typography on Front Left Box -->
    <g transform="translate(70, 140) skewY(15)">
      <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="28" fill="#ffffff">Aiira</text>
      <circle cx="34" cy="-18" r="3.5" fill="#75b8c8"/>
      <text x="0" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="9.5" fill="#75b8c8" letter-spacing="1">LUXURY FACIAL TISSUE</text>
      <text x="0" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="8" fill="#eaf6f8">100% Virgin Wood Pulp • 200 Pulls</text>
    </g>

    <!-- Botanical Leaf / Soft Icon on Box -->
    <g transform="translate(310, 110) skewY(-15)" opacity="0.6">
      <circle cx="20" cy="20" r="18" fill="none" stroke="#75b8c8" stroke-width="2"/>
      <path d="M12,25 C12,12 28,12 28,25 Z" fill="#75b8c8"/>
    </g>
  </g>

  <!-- POCKET TISSUE PACK (Front Floating Left) -->
  <g transform="translate(80, 410)" filter="url(#softShadow)">
    <rect x="0" y="0" width="130" height="95" rx="14" fill="#ffffff" stroke="#c2e3ec" stroke-width="2.5"/>
    <rect x="8" y="8" width="114" height="79" rx="8" fill="#f4fafb" />
    <path d="M30,35 C45,15 75,15 90,35" fill="none" stroke="#75b8c8" stroke-width="3" stroke-linecap="round"/>
    <text x="65" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" fill="#00587a" text-anchor="middle">Aiira</text>
    <text x="65" y="68" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="8" fill="#75b8c8" text-anchor="middle">POCKET WIPES</text>
  </g>

  <!-- FLOATING BADGE 1: 100% Virgin Pulp -->
  <g transform="translate(100, 120)" filter="url(#softShadow)">
    <rect width="180" height="54" rx="27" fill="#ffffff" stroke="#e0f2f5" stroke-width="2"/>
    <circle cx="28" cy="27" r="18" fill="#eaf7fa"/>
    <path d="M22,28 L26,32 L34,22" fill="none" stroke="#00587a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="56" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13" fill="#00587a">100% Pure Virgin Pulp</text>
    <text x="56" y="41" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="10.5" fill="#608b98">Extra Soft &amp; Gentle</text>
  </g>

  <!-- FLOATING BADGE 2: 3-Ply Extra Cushion -->
  <g transform="translate(520, 440)" filter="url(#softShadow)">
    <rect width="190" height="56" rx="28" fill="#ffffff" stroke="#e0f2f5" stroke-width="2"/>
    <circle cx="30" cy="28" r="18" fill="#00587a"/>
    <text x="30" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" fill="#ffffff" text-anchor="middle">3x</text>
    <text x="58" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13" fill="#00587a">3-Ply Cloud Softness</text>
    <text x="58" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="10.5" fill="#608b98">Dermatologically Safe</text>
  </g>
</svg>
