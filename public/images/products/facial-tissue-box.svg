<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="boxFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00587a"/>
      <stop offset="100%" stop-color="#003549"/>
    </linearGradient>
    <linearGradient id="boxTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#75b8c8"/>
      <stop offset="100%" stop-color="#559ea9"/>
    </linearGradient>
    <filter id="pShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#002d3d" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="500" height="400" fill="#f4fbfd" rx="20"/>
  
  <!-- Subtle background ring -->
  <circle cx="250" cy="220" r="140" fill="#e2f4f8" />

  <!-- Shadow below box -->
  <ellipse cx="250" cy="325" rx="170" ry="22" fill="#00374a" opacity="0.15" />

  <!-- Tissue emerging -->
  <g filter="url(#pShadow)">
    <path d="M200,165 C170,110 200,45 245,35 C285,25 320,80 290,130 C270,160 240,165 210,168 Z" fill="#ffffff" stroke="#d5edf2" stroke-width="1.5"/>
    <path d="M225,50 C250,75 270,105 265,140" stroke="#75b8c8" stroke-width="2" fill="none" opacity="0.6"/>
  </g>

  <!-- Box 3D Model -->
  <g filter="url(#pShadow)">
    <!-- Top Face -->
    <path d="M 100,180 L 250,135 L 400,180 L 250,225 Z" fill="url(#boxTop)" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Top Dispenser Cutout -->
    <ellipse cx="250" cy="180" rx="65" ry="16" fill="#002b3a" stroke="#ffffff" stroke-width="1"/>
    
    <!-- Left Front -->
    <path d="M 100,180 L 250,225 L 250,310 L 100,265 Z" fill="url(#boxFront)"/>
    <!-- Right Front -->
    <path d="M 250,225 L 400,180 L 400,265 L 250,310 Z" fill="#004661"/>

    <!-- Foil Trim Accent -->
    <path d="M 110,183 L 250,222 L 390,183" fill="none" stroke="#d4af37" stroke-width="2" opacity="0.8"/>

    <!-- Box Branding -->
    <g transform="translate(130, 245) skewY(16)">
      <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="22" fill="#ffffff">Aiira</text>
      <circle cx="26" cy="-14" r="2.8" fill="#75b8c8"/>
      <text x="0" y="14" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="8" fill="#75b8c8">PREMIUM FACIAL TISSUE</text>
      <text x="0" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" fill="#e0f2f5">3-Ply Feather Touch • 200 Pulls</text>
    </g>

    <!-- Side Specs Badge -->
    <g transform="translate(320, 220) skewY(-16)">
      <rect x="0" y="0" width="55" height="22" rx="4" fill="#003144" opacity="0.8"/>
      <text x="27" y="14" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="7.5" fill="#75b8c8" text-anchor="middle">ALOE INFUSED</text>
    </g>
  </g>
</svg>
