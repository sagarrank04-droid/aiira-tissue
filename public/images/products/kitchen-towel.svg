<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <filter id="rollShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#002d3d" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="500" height="400" fill="#f4fbfd" rx="20"/>
  <circle cx="250" cy="210" r="140" fill="#e2f4f8" />

  <!-- Ground Shadow -->
  <ellipse cx="250" cy="330" rx="150" ry="20" fill="#00374a" opacity="0.15" />

  <!-- Kitchen Towel Pair -->
  <!-- Left Roll -->
  <g transform="translate(140, 90)" filter="url(#rollShadow)">
    <ellipse cx="65" cy="40" rx="65" ry="30" fill="#eaf6f9" stroke="#bfe2ea" stroke-width="2"/>
    <rect x="0" y="40" width="130" height="190" fill="#ffffff" stroke="#e0f0f4" stroke-width="1"/>
    <ellipse cx="65" cy="230" rx="65" ry="30" fill="#d9edf2" />
    <ellipse cx="65" cy="40" rx="22" ry="10" fill="#75b8c8" opacity="0.4"/>
    <ellipse cx="65" cy="40" rx="12" ry="5.5" fill="#00587a"/>
    <!-- Embossed Pattern -->
    <path d="M10,90 Q65,100 120,90" fill="none" stroke="#d5edf2" stroke-width="2" stroke-dasharray="4 4"/>
    <path d="M10,140 Q65,150 120,140" fill="none" stroke="#d5edf2" stroke-width="2" stroke-dasharray="4 4"/>
    <path d="M10,190 Q65,200 120,190" fill="none" stroke="#d5edf2" stroke-width="2" stroke-dasharray="4 4"/>
    <!-- Band Wrap -->
    <rect x="0" y="115" width="130" height="50" fill="#00587a"/>
    <text x="65" y="140" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" fill="#ffffff" text-anchor="middle">Aiira</text>
    <text x="65" y="153" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="7.5" fill="#75b8c8" text-anchor="middle">KITCHEN TOWEL</text>
  </g>

  <!-- Right Roll (Slightly in front) -->
  <g transform="translate(235, 105)" filter="url(#rollShadow)">
    <ellipse cx="65" cy="40" rx="65" ry="30" fill="#f0fafc" stroke="#bfe2ea" stroke-width="2"/>
    <rect x="0" y="40" width="130" height="190" fill="#ffffff" stroke="#e0f0f4" stroke-width="1"/>
    <ellipse cx="65" cy="230" rx="65" ry="30" fill="#d0ebf2" />
    <ellipse cx="65" cy="40" rx="22" ry="10" fill="#75b8c8" opacity="0.4"/>
    <ellipse cx="65" cy="40" rx="12" ry="5.5" fill="#00587a"/>
    <!-- Band Wrap -->
    <rect x="0" y="125" width="130" height="50" fill="#75b8c8"/>
    <text x="65" y="150" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" fill="#ffffff" text-anchor="middle">SUPER ABSORB</text>
    <text x="65" y="163" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="7.5" fill="#003549" text-anchor="middle">2-PLY QUILTED TECH</text>
  </g>
</svg>
