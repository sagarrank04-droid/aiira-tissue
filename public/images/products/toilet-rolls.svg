<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <filter id="packShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#002d3d" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="500" height="400" fill="#f4fbfd" rx="20"/>
  <circle cx="250" cy="200" r="140" fill="#e2f4f8" />
  <ellipse cx="250" cy="335" rx="160" ry="22" fill="#00374a" opacity="0.15" />

  <!-- Multi-Pack Toilet Paper Stack -->
  <!-- Back Roll Left -->
  <g transform="translate(130, 80)" filter="url(#packShadow)">
    <ellipse cx="60" cy="35" rx="55" ry="25" fill="#e8f6f9" stroke="#bfe2ea" stroke-width="1.5"/>
    <rect x="5" y="35" width="110" height="110" fill="#ffffff" stroke="#e0f0f4" stroke-width="1"/>
    <ellipse cx="60" cy="145" rx="55" ry="25" fill="#d0ebf2"/>
    <ellipse cx="60" cy="35" rx="16" ry="8" fill="#00587a"/>
  </g>

  <!-- Back Roll Right -->
  <g transform="translate(250, 80)" filter="url(#packShadow)">
    <ellipse cx="60" cy="35" rx="55" ry="25" fill="#e8f6f9" stroke="#bfe2ea" stroke-width="1.5"/>
    <rect x="5" y="35" width="110" height="110" fill="#ffffff" stroke="#e0f0f4" stroke-width="1"/>
    <ellipse cx="60" cy="145" rx="55" ry="25" fill="#d0ebf2"/>
    <ellipse cx="60" cy="35" rx="16" ry="8" fill="#00587a"/>
  </g>

  <!-- Front Roll Left -->
  <g transform="translate(100, 160)" filter="url(#packShadow)">
    <ellipse cx="60" cy="35" rx="55" ry="25" fill="#f2fafc" stroke="#bfe2ea" stroke-width="1.5"/>
    <rect x="5" y="35" width="110" height="120" fill="#ffffff" stroke="#e0f0f4" stroke-width="1"/>
    <ellipse cx="60" cy="155" rx="55" ry="25" fill="#cbe9f0"/>
    <ellipse cx="60" cy="35" rx="18" ry="8" fill="#75b8c8" opacity="0.5"/>
    <ellipse cx="60" cy="35" rx="12" ry="5.5" fill="#00587a"/>
    <circle cx="60" cy="95" r="28" fill="#00587a"/>
    <text x="60" y="93" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" fill="#ffffff" text-anchor="middle">Aiira</text>
    <text x="60" y="104" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="6.5" fill="#75b8c8" text-anchor="middle">3-PLY</text>
  </g>

  <!-- Front Roll Right -->
  <g transform="translate(225, 160)" filter="url(#packShadow)">
    <ellipse cx="60" cy="35" rx="55" ry="25" fill="#f2fafc" stroke="#bfe2ea" stroke-width="1.5"/>
    <rect x="5" y="35" width="110" height="120" fill="#ffffff" stroke="#e0f0f4" stroke-width="1"/>
    <ellipse cx="60" cy="155" rx="55" ry="25" fill="#cbe9f0"/>
    <ellipse cx="60" cy="35" rx="18" ry="8" fill="#75b8c8" opacity="0.5"/>
    <ellipse cx="60" cy="35" rx="12" ry="5.5" fill="#00587a"/>
    <rect x="15" y="75" width="90" height="42" rx="6" fill="#75b8c8"/>
    <text x="60" y="94" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" fill="#ffffff" text-anchor="middle">CloudSoft</text>
    <text x="60" y="106" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="6.5" fill="#003b4f" text-anchor="middle">100% PURE PULP</text>
  </g>
